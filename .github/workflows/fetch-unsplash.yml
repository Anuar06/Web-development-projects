# One-shot helper: this Claude Code environment can't reach stock photo
# sites, so a runner fetches candidate photos + a manifest for local
# review. Delete after use.
# v3: Unsplash bot-blocks GitHub runners (Anubis challenge), so query
# Openverse (CC-licensed images, keyless API) instead.
name: Fetch unsplash candidates
on:
  push:
    branches: [claude/website-logo-reviews-iqpbn2]
    paths: ['.github/workflows/fetch-unsplash.yml']
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Search and download candidates
        run: |
          set +e
          UA="dkcars-site-builder/1.0 (contact: via github repo)"
          mkdir -p dkcars/img/candidates
          rm -f dkcars/img/candidates/debug-*.txt
          printf 'slug\tid\ttitle\tcreator\tlicense\tsource_page\turl\n' > /tmp/manifest.tsv
          fetch_query () {
            local slug="$1"; shift
            local query="$*"
            local enc="${query// /%20}"
            curl -sL --max-time 30 \
              "https://api.openverse.org/v1/images/?q=${enc}&license_type=commercial&per_page=8" \
              -H "User-Agent: $UA" -H "Accept: application/json" > "/tmp/$slug.json"
            if ! jq -e '.results | length > 0' "/tmp/$slug.json" >/dev/null 2>&1; then
              head -c 300 "/tmp/$slug.json" > "dkcars/img/candidates/debug-$slug.txt"
              echo "query failed: $slug"
              return
            fi
            jq -r --arg slug "$slug" '.results[] | [$slug, .id, (.title // ""), (.creator // ""), .license, (.foreign_landing_url // ""), .url] | @tsv' \
              "/tmp/$slug.json" >> /tmp/manifest.tsv
            local i=0
            jq -r '.results[].url' "/tmp/$slug.json" | while read -r url; do
              curl -sL --max-time 60 -o "dkcars/img/candidates/${slug}-${i}.img" \
                -H "User-Agent: $UA" "$url"
              i=$((i+1))
            done
          }
          fetch_query bmw bmw 4 series coupe
          fetch_query bmw2 bmw coupe grey
          fetch_query beetle volkswagen beetle white
          fetch_query beetle2 vw new beetle
          cp /tmp/manifest.tsv dkcars/img/candidates/manifest.tsv
          find dkcars/img/candidates -type f -size 0 -delete
          # keep the payload reviewable but small: drop files > 8MB
          find dkcars/img/candidates -type f -size +8M -delete
          ls -la dkcars/img/candidates
          exit 0
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dkcars/img/candidates
          git commit -m "Add openverse candidate images for review" || echo "nothing to commit"
          git push || true
